# Odoo 19.0 — {{REPO}}
# Derived from OCA/oca-addons-repo-template, trimmed to what a private project needs
# (the OCA README/website generators are for community addon repos and are omitted).
#
# Local use:  pre-commit install && pre-commit run --all-files
# CI runs the exact same file, so local and CI can never disagree.

exclude: |
  (?x)
  ^setup/|/static/description/index\.html$|
  \.svg$|/tests/([^/]+/)?cassettes/|
  /static/(src/)?lib/|
  /build/|/dist/|
  /tests/samples/.*|
  (LICENSE.*|COPYING.*)

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-xml
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # OCA's own Odoo-module checks: manifest keys, xmlid uniqueness/existence,
  # ir.model.access.csv sanity, .po correctness.
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.27
    hooks:
      - id: oca-checks-odoo-module
        # --fix auto-corrects the mechanical findings (XML headers, attribute
        # order). Opt-outs for the rest live in .oca_hooks.cfg.
        args: ["--fix"]
      - id: oca-checks-po

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Odoo-aware pylint. Two passes, mirroring OCA:
  #   pylint_odoo  -> .pylintrc-mandatory, blocking. Real defects.
  #   pylint_odoo_optional -> .pylintrc, advisory. Style and nits.
  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.11
    hooks:
      - id: pylint_odoo
        name: pylint-odoo (mandatory)
        args: ["--rcfile=.pylintrc-mandatory"]
        # tools/ is ordinary CLI Python, not addon code. Odoo addon rules
        # (print-used, etc.) do not apply and would fire on every run.
        exclude: ^tools/
      - id: pylint_odoo
        alias: pylint_odoo_optional
        name: pylint-odoo (optional, advisory)
        verbose: true
        args: ["--rcfile=.pylintrc", "--exit-zero"]
        exclude: ^tools/
