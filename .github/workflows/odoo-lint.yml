name: lint

on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (ruff, pylint-odoo, OCA checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install --disable-pip-version-check "pre-commit==4.4.0"

      # Same file developers run locally, so local and CI cannot disagree.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
