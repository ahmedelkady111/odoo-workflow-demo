name: branch-policy

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  push:
    branches: [main, staging]

permissions:
  contents: read
  issues: write

jobs:
  # PREVENTIVE. Blocks the PR when the head->base pair is not an allowed path.
  pr-policy:
    name: PR targets an allowed branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check head -> base
        run: |
          bash .github/scripts/branch_policy.sh \
            "${{ github.head_ref }}" "${{ github.base_ref }}"

  # DETECTIVE ONLY. GitHub has no pre-receive hooks, so a workflow cannot reject
  # a push -- it can only notice afterwards. What actually PREVENTS a direct push
  # is branch protection; see the "Repo admin checklist" in the template README.
  no-direct-push:
    name: No direct pushes to protected branches
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify this push came from a merged PR
        id: check
        run: |
          SHA="${{ github.sha }}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          PARENTS=$(git rev-list --parents -n 1 "$SHA" | wc -w)
          SUBJECT=$(git log -1 --pretty=%s "$SHA")

          # A PR merge is a merge commit (2+ parents). Squash/rebase merges are
          # single-parent but GitHub gives them a "(#N)" suffix.
          if [ "$PARENTS" -ge 3 ] && echo "$SUBJECT" | grep -qE '^Merge pull request #[0-9]+'; then
            echo "OK: merge commit from a pull request."; exit 0
          fi
          if echo "$SUBJECT" | grep -qE '\(#[0-9]+\)$'; then
            echo "OK: squash/rebase merge from a pull request."; exit 0
          fi

          {
            echo "violation=true"
            echo "branch=$BRANCH"
            echo "actor=${{ github.actor }}"
          } >> "$GITHUB_OUTPUT"

          echo "::error::Direct push to protected branch '$BRANCH' by ${{ github.actor }}."
          echo "Commit: $SHA"
          echo "Subject: $SUBJECT"
          echo "All changes must arrive via pull request. See docs/WORKFLOW.md."
          exit 1

      - name: Open an issue recording the violation
        if: failure() && steps.check.outputs.violation == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Direct push to ${{ steps.check.outputs.branch }} by ${{ github.actor }}" \
            --body "$(cat <<EOF
          A commit reached \`${{ steps.check.outputs.branch }}\` without a pull request.

          - Commit: ${{ github.sha }}
          - Pushed by: @${{ github.actor }}
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This check is **detective only** -- it cannot block a push. If this keeps
          happening, enable branch protection on \`${{ steps.check.outputs.branch }}\`
          (see the Repo admin checklist in the project README).
          EOF
          )" || echo "Could not open an issue (issues may be disabled)."
